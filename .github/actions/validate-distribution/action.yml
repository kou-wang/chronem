name: Validate Python distribution
description: Build, inspect, install, and smoke-test Chronem's wheel and sdist

runs:
  using: composite
  steps:
    - name: Install packaging tools
      shell: bash
      run: python -m pip install "build>=1.2,<2" "twine>=6,<7"

    - name: Build wheel and sdist
      shell: bash
      run: python -m build

    - name: Validate package metadata
      shell: bash
      run: python -m twine check --strict dist/*

    - name: Validate artifact names and contents
      shell: bash
      run: python scripts/validate_distribution.py dist

    - name: Smoke-test the installed wheel in a fresh environment
      shell: bash
      run: |
        smoke_dir="$(mktemp -d "$RUNNER_TEMP/chronem-wheel-smoke.XXXXXX")"
        python -m venv "$smoke_dir"
        "$smoke_dir/bin/python" -m pip install --upgrade pip
        wheels=(dist/*.whl)
        "$smoke_dir/bin/python" -m pip install "${wheels[0]}[postgres]"
        cp scripts/smoke_installed_wheel.py "$smoke_dir/"
        cp scripts/smoke_installed_wheel_postgres.py "$smoke_dir/"
        cp examples/deterministic_lifecycle.py "$smoke_dir/"
        (
          cd "$RUNNER_TEMP"
          "$smoke_dir/bin/python" "$smoke_dir/smoke_installed_wheel.py"
          "$smoke_dir/bin/python" "$smoke_dir/deterministic_lifecycle.py"
          "$smoke_dir/bin/python" "$smoke_dir/smoke_installed_wheel_postgres.py" \
            --database-url "$CHRONEM_DISTRIBUTION_DATABASE_URL" \
            --source-root "$GITHUB_WORKSPACE"
        )
