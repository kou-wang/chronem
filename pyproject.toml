[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mnemo-memory"
version = "0.1.0"
description = "Open-source temporal memory engine for AI applications"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Kou Wang" }]
keywords = [
  "ai",
  "memory",
  "temporal",
  "lifecycle",
  "retrieval",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
]

[project.urls]
Repository = "https://github.com/kou-wang/mnemo-memory"
Issues = "https://github.com/kou-wang/mnemo-memory/issues"
Documentation = "https://github.com/kou-wang/mnemo-memory/tree/main/docs"

[project.optional-dependencies]
openai = [
  "openai>=3.26.1,<4",
]
postgres = [
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]
dev = [
  "alembic>=1.14,<2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "openai>=3.26.1,<4",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mnemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: requires a real PostgreSQL database",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mnemo"]
